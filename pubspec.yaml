name: kashi_geofield_pro
description: "kashi GeoField Pro - Professional Android Field Mapping Application"
publish_to: "none"
version: 1.2.0+2

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Map Engine
  flutter_map: ^6.0.0
  latlong2: ^0.9.0

  # Database
  sqflite: ^2.3.0
  path_provider: ^2.1.0

  # File & Archive
  archive: ^3.4.0
  file_picker: ^8.0.0

  # XML & GeoJSON
  xml: ^6.3.0
  geojson_vi: ^2.2.0
  collection: ^1.18.0

  # Sharing
  share_plus: ^7.2.2

  # Location
  geolocator: ^10.1.0

  # Permissions
  permission_handler: ^12.0.3

  # PDF & Print
  pdf: ^3.10.0
  printing: ^5.13.1
  screenshot: ^3.0.0

  # Excel
  excel: ^4.0.6

  # UI
  flutter_colorpicker: ^1.0.3

  # HTTP (for Nominatim search)
  http: ^1.1.0

  # Shared Preferences (for settings)
  shared_preferences: ^2.2.0

  # Icon
  cupertino_icons: ^1.0.6

  # Offline maps tile caching
  flutter_map_cancellable_tile_provider: ^2.0.0

  # Path utilities
  path: ^1.8.3

  url_launcher: ^6.2.0
  image_picker: ^1.2.3
  image: ^4.3.0
  gal: ^2.3.2
  exif: ^3.3.0
  pdfx: ^2.9.2
  google_mlkit_text_recognition: ^0.16.0
  speech_to_text: ^7.4.0
  flutter_compass: ^0.8.1
  webview_flutter: ^4.14.1
  syncfusion_flutter_pdfviewer: ^33.2.13
dependency_overrides:
  flutter_plugin_android_lifecycle: 2.0.21
  permission_handler: ^12.0.3
  permission_handler_android: ^12.0.13
  permission_handler_apple: ^9.0.7
  geolocator: ^10.1.0
  geolocator_android: ^4.1.8
  geolocator_apple: ^2.3.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/pdfs/
    - assets/fonts/
  fonts:
    - family: NotoSansKannada
      fonts:
        - asset: assets/fonts/NotoSansKannada-Regular.ttf
          weight: 400
        - asset: assets/fonts/NotoSansKannada-Variable.ttf
          weight: 700

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/app_icon.jpg"
  adaptive_icon_background: "assets/images/app_icon_bg.png"
  adaptive_icon_foreground: "assets/images/transparent.png"
  
