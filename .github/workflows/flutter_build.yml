name: Flutter CI/CD Build

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to create/update GitHub Releases

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: false

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Release APK
        run: flutter build apk --release --split-per-abi

      # ── Upload APK as workflow artifact (90-day retention) ──────────────────
      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kashi-geofield-pro-apks
          path: build/app/outputs/flutter-apk/
          retention-days: 90

      # ── Create/Update a rolling GitHub Release so anyone can download ────────
      - name: Delete old 'latest' release (if exists)
        uses: actions/github-script@v7
        if: github.event_name == 'push'
        with:
          script: |
            try {
              const rel = await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag: 'latest-build',
              });
              await github.rest.repos.deleteRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: rel.data.id,
              });
              console.log('Deleted old release');
            } catch (e) {
              console.log('No old release found, creating fresh');
            }
            try {
              await github.rest.git.deleteRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: 'tags/latest-build',
              });
            } catch (e) {}

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: github.event_name == 'push'
        with:
          tag_name: latest-build
          name: "📱 Kashi GeoField Pro v1.2.0"
          body: |
            ## Kashi GeoField Pro v1.2.0 — Latest Build
            
            **Auto-generated from commit:** `${{ github.sha }}`  
            **Branch:** `${{ github.ref_name }}`  
            **Date:** ${{ github.event.head_commit.timestamp }}
            
            ### 📥 How to Install
            Pick the right APK for your phone:
            | APK File | Best For |
            |---|---|
            | `app-arm64-v8a-release.apk` | **Most modern phones** (OnePlus, Samsung, Xiaomi 2018+) ✅ Recommended |
            | `app-armeabi-v7a-release.apk` | Older Android phones |
            | `app-release.apk` | Universal (all phones, largest file) |
            
            **Steps:**
            1. Download the APK for your phone (use arm64-v8a if unsure)
            2. Open it on your Android phone
            3. Allow "Install from unknown sources" if prompted
            4. Install and open!
            
            > **Works on:** Android 7.0+ (OnePlus, Motorola, Samsung, Xiaomi, etc.)
            
            ### ✨ What's New in v1.2.0
            - 🧭 Compass with live heading display and map rotation
            - 🕰️ Historical satellite imagery (ESRI Wayback)
            - 🛠️ Cleaner sidebar — Tools toggle hides secondary buttons
            - 🐛 Fixed: Voice diary now continues from where you stopped
            - 📦 Smaller APK size (code shrinking + per-arch splits enabled)
          files: |
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
            build/app/outputs/flutter-apk/app-release.apk
          token: ${{ secrets.GITHUB_TOKEN }}
          draft: false
          prerelease: false
          make_latest: true
          fail_on_unmatched_files: false
